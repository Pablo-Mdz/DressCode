name: CI

on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the code. Without this block it would inherit the
# repository default, which can be read/write on every token it hands out.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck and build the app
        run: npm run build

      - name: Typecheck the Cloud Functions
        run: npm run build --prefix functions

      - name: Firestore and Storage rules tests
        run: npm run test:rules
